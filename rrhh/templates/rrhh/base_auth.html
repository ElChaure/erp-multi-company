<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RRHH System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
        }
        .login-logo {
            display: inline-flex;
            width: 64px;
            height: 64px;
            background: #2563eb;
            color: #fff;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
